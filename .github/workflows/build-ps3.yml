name: Build Halo CE PS3

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS3 PKG & Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull ps3dev Docker image
        run: |
          docker pull mayo2853/ps3dev-latest:latest
          docker tag mayo2853/ps3dev-latest:latest ps3dev-latest:latest

      - name: Build Halo PS3 PKG
        run: |
          chmod +x build.sh
          ./build.sh -j$(nproc) pkg

      - name: Build Halo Data Installer EBOOT
        run: |
          docker run --rm -v "$PWD:/src" -w /src/tools/data_installer ps3dev-latest:latest make
          ls -la tools/data_installer/build/

      - name: Verify build artifacts
        run: |
          ls -la build/ps3/
          ls -la tools/data_installer/build/

      - name: Upload PKG and Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo_ps3_binaries
          path: |
            build/ps3/halo_ps3.pkg
            build/ps3/EBOOT.BIN
            tools/data_installer/build/EBOOT.BIN
